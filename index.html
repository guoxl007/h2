const P=(1n<<255n)-19n,md=a=>{a%=P;return a<0n?a+P:a},le=a=>{let x=0n;for(let i=31;i>=0;i--)x=(x<<8n)|BigInt(a[i]);return x};
function x25519(k,u){k=Uint8Array.from(k);k[0]&=248;k[31]&=127;k[31]|=64;u=Uint8Array.from(u);u[31]&=127;
 const s=le(k),x1=le(u)%P;let x2=1n,z2=0n,x3=x1,z3=1n,sw=0n;
 for(let t=254n;t>=0n;t--){const kt=(s>>t)&1n;sw^=kt;if(sw){[x2,x3]=[x3,x2];[z2,z3]=[z3,z2]}sw=kt;

  x3=md((DA+CB)**2n);z3=md(x1*md((DA-CB)**2n));x2=md(AA*BB);z2=md(E*(AA+121665n*E))}
 if(sw){[x2,x3]=[x3,x2];[z2,z3]=[z3,z2]}

 const wk=await crypto.subtle.importKey('raw',await crypto.subtle.digest('SHA-256',m),'AES-GCM',false,['decrypt']);

async function openK(raw){const K=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(B.v)},K,u8(B.c)))}
