function x25519(k,u){k=Uint8Array.from(k);k[0]&=248;k[31]&=127;k[31]|=64;u=Uint8Array.from(u);u[31]&=127;
 const s=le(k),x1=le(u)%P;let x2=1n,z2=0n,x3=x1,z3=1n,sw=0n;
 for(let t=254n;t>=0n;t--){const kt=(s>>t)&1n;sw^=kt;if(sw){[x2,x3]=[x3,x2];[z2,z3]=[z3,z2]}sw=kt;
