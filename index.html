async function openWith(bits){bits=new Uint8Array(bits);if(bits.length!==32)return null;const sh=x25519(bits,u8(B.e));
 for(const w of B.w){try{return await openK(await unwrap(sh,w))}catch(e){}}return null}
async function show(h){if(document.readyState!=='complete')await new Promise(r=>addEventListener('load',r));document.open();document.write(h);document.close()}
(async()=>{try{const sv=localStorage.getItem('h2k');if(sv){const h=await openWith(u8(sv));if(h)return show(h);localStorage.removeItem('h2k')}}catch(e){}})();
document.getElementById('f').addEventListener('submit',async ev=>{ev.preventDefault();const e=document.getElementById('e');e.textContent='解密中…';
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('p').value),'PBKDF2',false,['deriveBits']);
 const seen=new Set();for(const w of B.w){if(seen.has(w.s))continue;seen.add(w.s);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:u8(w.s),iterations:B.i,hash:'SHA-256'},km,256);
  const h=await openWith(bits);
  if(h){try{if(document.getElementById('r').checked)localStorage.setItem('h2k',b64(bits))}catch(x){}return show(h)}}
 e.textContent='密码不对';});</script></body></html>
