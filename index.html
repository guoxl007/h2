 for(let t=254n;t>=0n;t--){const kt=(s>>t)&1n;sw^=kt;if(sw){[x2,x3]=[x3,x2];[z2,z3]=[z3,z2]}sw=kt;
  const A=x2+z2,AA=md(A*A),B=x2-z2,BB=md(B*B),E=AA-BB,C=x3+z3,D=x3-z3,DA=md(D*A),CB=md(C*B);
  x3=md((DA+CB)**2n);z3=md(x1*md((DA-CB)**2n));x2=md(AA*BB);z2=md(E*(AA+121665n*E))}
 if(sw){[x2,x3]=[x3,x2];[z2,z3]=[z3,z2]}
 let r=1n,b=md(z2),e=P-2n;while(e>0n){if(e&1n)r=r*b%P;b=b*b%P;e>>=1n}let o=md(x2*r);const out=new Uint8Array(32);for(let i=0;i<32;i++){out[i]=Number(o&255n);o>>=8n}return out}
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)), b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));

async function unwrap(sh,w){const E=u8(B.e),P=u8(w.p);const m=new Uint8Array(TAG.length+96);m.set(TAG,0);m.set(sh,TAG.length);m.set(E,TAG.length+32);m.set(P,TAG.length+64);
 const wk=await crypto.subtle.importKey('raw',await crypto.subtle.digest('SHA-256',m),'AES-GCM',false,['decrypt']);
 return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(w.v)},wk,u8(w.k)))}
async function openK(raw){const K=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(B.v)},K,u8(B.c)))}
async function openWith(bits){bits=new Uint8Array(bits);if(bits.length!==32)return null;const sh=x25519(bits,u8(B.e));
 for(const w of B.w){try{return await openK(await unwrap(sh,w))}catch(e){}}return null}
