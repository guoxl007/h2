const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)), b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function openWith(kek){for(const w of B.w){try{const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(w.v)},kek,u8(w.k));
 const K=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(B.v)},K,u8(B.c)))}catch(e){}}return null}
async function show(h){if(document.readyState!=='complete')await new Promise(r=>addEventListener('load',r));document.open();document.write(h);document.close()}
(async()=>{try{const sv=localStorage.getItem('h2k');if(sv){const k=await crypto.subtle.importKey('raw',u8(sv),'AES-GCM',false,['decrypt']);
